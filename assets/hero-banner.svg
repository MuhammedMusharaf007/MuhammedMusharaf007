<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0D1326"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 70) scale(360 220)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 260) scale(380 220)">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; r: 4.5; }
        50% { opacity: 0.45; r: 6; }
      }
      @keyframes floatLine {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .pulse { animation: pulseDot 2.4s ease-in-out infinite; }
      .float { animation: floatLine 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowLeft)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <g transform="translate(56, 44)">
    <rect x="0" y="0" width="330" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="18" cy="15" r="4.5" fill="#22D3EE" class="pulse"/>
    <text x="32" y="19" fill="#CBD5E1" font-size="12.5" font-weight="600" class="mono">
      SENIOR AI ENGINEER @ MICRON TECHNOLOGY
    </text>
  </g>

  <!-- Right Top Coordinate Tag -->
  <text x="1144" y="63" text-anchor="end" fill="#64748B" font-size="12" class="mono">
    HYDERABAD, IN · 10+ TB/DAY · AGENTIC AI
  </text>

  <!-- Main Name -->
  <text x="56" y="138" fill="#F8FAFC" font-size="52" font-weight="800" letter-spacing="-1.2" class="sans">
    Muhammed Musharaf
  </text>

  <!-- Accent Underline -->
  <rect x="56" y="154" width="210" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Value Proposition Subtitle -->
  <text x="56" y="196" fill="#CBD5E1" font-size="20" font-weight="500" class="sans">
    Architecting Petabyte-Scale Data Platforms, MCPs &amp; Production Agentic AI
  </text>

  <!-- Credentials Pills -->
  <g transform="translate(56, 232)" class="sans">
    <rect x="0" y="0" width="222" height="34" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="16" y="21.5" fill="#7DD3FC" font-size="13" font-weight="600">Google AI Professional</text>

    <rect x="236" y="0" width="252" height="34" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#818CF8" stroke-opacity="0.3"/>
    <text x="252" y="21.5" fill="#A5B4FC" font-size="13" font-weight="600">GCP Professional Data Engineer</text>

    <rect x="502" y="0" width="186" height="34" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#C084FC" stroke-opacity="0.3"/>
    <text x="518" y="21.5" fill="#E9D5FF" font-size="13" font-weight="600">IIM Kozhikode MBA</text>

    <rect x="702" y="0" width="146" height="34" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#94A3B8" stroke-opacity="0.25"/>
    <text x="718" y="21.5" fill="#E2E8F0" font-size="13" font-weight="600">ex-NIT Calicut</text>
  </g>

  <!-- Decorative Architectural Node Graphic (Right Side) -->
  <g transform="translate(950, 96)" class="float" opacity="0.85">
    <line x1="40" y1="30" x2="120" y2="65" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
    <line x1="120" y1="65" x2="60" y2="125" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.5"/>
    <line x1="120" y1="65" x2="175" y2="25" stroke="#C084FC" stroke-opacity="0.45" stroke-width="1.5"/>
    <line x1="120" y1="65" x2="175" y2="125" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>

    <circle cx="40" cy="30" r="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="175" cy="25" r="7" fill="#0F172A" stroke="#C084FC" stroke-width="2"/>
    <circle cx="120" cy="65" r="12" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2.5"/>
    <circle cx="120" cy="65" r="4" fill="#38BDF8"/>
    <circle cx="60" cy="125" r="7" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
    <circle cx="175" cy="125" r="8" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
  </g>
</svg>
